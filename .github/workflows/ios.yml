name: iOS checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify recipe database and import pipeline
        run: python3 scripts/test-catalog.py
      - name: Test vision evaluation metrics
        run: |
          python3 scripts/test-recognition-evaluation.py
          python3 scripts/vision/test_benchmark.py
      - name: Test recipe and persistence logic
        run: bash scripts/test-core.sh
      - name: Verify real-photo recognition on macOS
        run: |
          xcrun swiftc -parse-as-library -swift-version 5 \
            "Recipe Maker/Recipe Maker/Core/Ingredient.swift" \
            "Recipe Maker/Recipe Maker/Core/RecognitionPolicy.swift" \
            "Recipe Maker/Recipe Maker/IngredientRecognizer.swift" \
            scripts/RecognitionSmoke.swift -o "$RUNNER_TEMP/recognition-smoke"
          "$RUNNER_TEMP/recognition-smoke" "Recipe Maker/Recipe MakerTests/Fixtures/Recognition/cases.json"
      - name: Verify staged recognition without model dependencies
        run: |
          xcrun swiftc -parse-as-library -swift-version 5 \
            "Recipe Maker/Recipe Maker/Core/Ingredient.swift" \
            "Recipe Maker/Recipe Maker/Core/RecognitionPolicy.swift" \
            "Recipe Maker/Recipe Maker/IngredientRecognizer.swift" \
            scripts/RecognitionPipelineTests.swift -o "$RUNNER_TEMP/recognition-pipeline-tests"
          "$RUNNER_TEMP/recognition-pipeline-tests"
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          phones = [d for runtime, items in devices.items() if ".iOS-" in runtime for d in items if d["name"].startswith("iPhone")]
          if not phones:
              raise SystemExit("No iPhone simulator installed")
          print("id=" + phones[0]["udid"])
          PY
      - name: Build app and run unit and UI tests
        run: >-
          xcodebuild test
          -project "Recipe Maker/Recipe Maker.xcodeproj"
          -scheme "Recipe Maker"
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}'
          -parallel-testing-enabled NO
          -resultBundlePath TestResults.xcresult
          CODE_SIGNING_ALLOWED=NO
